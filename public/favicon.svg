<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000000" />
      <stop offset="100%" stop-color="#18181b" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F04A00" />
      <stop offset="100%" stop-color="#ff7e40" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#F04A00" flood-opacity="0.3" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#brandGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />
  
  <!-- Geometric "S" Shape with Orange Accent Flame -->
  <g transform="translate(106, 86)">
    <!-- Top Arc of S -->
    <path d="M 230 40 C 230 40, 70 40, 70 140 C 70 230, 230 210, 230 290 C 230 350, 90 350, 70 340" 
          fill="none" stroke="#F5F5EE" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Dynamic Accent Node -->
    <circle cx="230" cy="40" r="26" fill="url(#accentGrad)" filter="url(#shadow)" />
    <circle cx="70" cy="340" r="26" fill="url(#accentGrad)" filter="url(#shadow)" />
  </g>
</svg>