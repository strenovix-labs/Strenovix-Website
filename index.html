<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Favicon / Site Logo -->
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <link rel="shortcut icon" type="image/jpeg" href="/logo.jpeg" />
    <link rel="apple-touch-icon" href="/logo.jpeg" />

    <!-- Viewport -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- SEO -->
    <title>Strenovix — AI Software & Digital Solutions</title>

    <meta
      name="description"
      content="Strenovix builds AI software, digital solutions, web platforms, mobile applications, and intelligent business systems."
    />

    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://www.strenovix.in/"
    />

    <!-- Open Graph -->
    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://www.strenovix.in/"
    />

    <meta
      property="og:title"
      content="Strenovix — AI Software & Digital Solutions"
    />

    <meta
      property="og:description"
      content="Strenovix builds AI software, digital solutions, web platforms, mobile applications, and intelligent business systems."
    />

    <meta
      property="og:image"
      content="https://www.strenovix.in/logo.jpeg"
    />

    <meta
      property="og:image:alt"
      content="Strenovix Logo"
    />

    <meta
      property="og:site_name"
      content="Strenovix"
    />

    <!-- Twitter / X -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="Strenovix — AI Software & Digital Solutions"
    />

    <meta
      name="twitter:description"
      content="Strenovix builds AI software, digital solutions, web platforms, mobile applications, and intelligent business systems."
    />

    <meta
      name="twitter:image"
      content="https://www.strenovix.in/logo.jpeg"
    />

    <meta
      name="twitter:image:alt"
      content="Strenovix Logo"
    />

    <!-- Theme -->
    <meta
      name="theme-color"
      content="#ffffff"
    />

    <!-- Organization Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "Strenovix",
        "url": "https://www.strenovix.in/",
        "logo": "https://www.strenovix.in/logo.jpeg",
        "description": "Strenovix builds AI software, digital solutions, web platforms, mobile applications, and intelligent business systems."
      }
    </script>

    <!-- Website Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Strenovix",
        "url": "https://www.strenovix.in/"
      }
    </script>

    <!-- Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Anton&family=Inter:wght@400;500;600;700;800&family=Syne:wght@500;600;700;800&family=DM+Sans:wght@400;500;700&family=Outfit:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <script
      type="module"
      src="/src/main.jsx"
    ></script>
  </body>
</html>
